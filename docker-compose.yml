version: "3.8"

services:
  # Real-time API servisi — sürekli çalışır, HTTP istekleri bekler
  realtime:
    build:
      context: .
      dockerfile: realtime/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Batch processor — tek seferlik çalışır
  batch:
    build:
      context: .
      dockerfile: batch/Dockerfile
    volumes:
      - ./data:/app/data
      - ./examples:/app/examples
    environment:
      - PYTHONUNBUFFERED=1

  # Stream consumer — event'leri işler
  stream:
    build:
      context: .
      dockerfile: stream/Dockerfile
    volumes:
      - ./data:/app/data
      - ./examples:/app/examples
    environment:
      - PYTHONUNBUFFERED=1
